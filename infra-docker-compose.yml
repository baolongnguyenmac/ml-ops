services:
  company_db:
    # db of a company
    image: postgres:16
    command: ['postgres', '-c', 'wal_level=logical']
    container_name: ctn_com_db
    healthcheck:
      test: [
        'CMD-SHELL',
        'psql -U ${COM_DB_USER} -d ${COM_DB_NAME} -c "SELECT 1" && psql -U ${COM_DB_USER} -d ${COM_META_DB_NAME} -c "SELECT 1" && psql -U ${COM_DB_USER} -d ${COM_GOLD_DB_NAME} -c "SELECT 1"'
      ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${COM_DB_PORT}:5432"
    environment:
      - POSTGRES_DB=${COM_DB_NAME}
      - POSTGRES_USER=${COM_DB_USER}
      - POSTGRES_PASSWORD=${COM_DB_PASSWORD}
    volumes: 
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - com_db:/var/lib/postgresql

  # ------------------------------------------------------------------------------------------------------------
  # Batch layer: Delta Lake
  # ------------------------------------------------------------------------------------------------------------

  lh-metastore:
    image: 'starburstdata/hive:3.1.3-e.15'
    container_name: ctn_lh_hive
    hostname: lh-metastore
    ports:
      - 9084:9083
    env_file:
      - .env_file/infra.env
    environment:
      - HIVE_METASTORE_JDBC_URL=${LH_METASTORE_JDBC_URL}
    depends_on:
      company_db:
        condition: service_healthy

  trino:
    image: "trinodb/trino:480"
    container_name: ctn_trino
    hostname: trino
    ports:
      - "8082:8080" # So client can read from here
    env_file:
      - .env_file/infra.env
    volumes:
      - ./trino/etc:/usr/lib/trino/etc:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      - lh-metastore

  # ------------------------------------------------------------------------------------------------------------
  # Speed layer: Confluent stack
  # https://github.com/confluentinc/cp-all-in-one/blob/8.2.0-post/cp-all-in-one/docker-compose.yml
  # ------------------------------------------------------------------------------------------------------------

  # Kafka broker, each broker can be considered as a node
  broker:
    image: confluentinc/cp-server:8.2.0
    hostname: broker
    container_name: ctns_broker
    ports:
      - "9092:9092"
      - "9101:9101"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      start_period: 15s
      interval: 20s
      timeout: 10s
      retries: 10
    env_file:
      - .env_file/infra.env

  # Store Avro schemas for topics to ensure schema compatibility
  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    hostname: schema-registry
    container_name: ctns_schema-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: curl --user superUser:superUser --fail --silent --insecure http://localhost:8081/subjects --output /dev/null || exit 1
      start_period: 10s
      interval: 20s
      retries: 10
    env_file:
      - .env_file/infra.env

  # Connector hub
  # Add plugin to connect stuff (Debezium, SinkJDBC,...) to Kafka
  connect:
    build:
      context: ./connect
    image: local/cp-server-connect-debezium:0.6.4-7.6.0
    hostname: connect
    container_name: ctns_connect
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      company_db:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf -X GET http://localhost:8083/connectors || exit 1']
      start_period: 10s
      interval: 20s
      timeout: 5s
      retries: 5
    env_file:
      - .env_file/infra.env

  control-center:
    image: confluentinc/cp-enterprise-control-center-next-gen:2.5.0
    hostname: control-center
    container_name: ctns_control-center
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      connect:
        condition: service_healthy
      # ksqldb-server:
      #   condition: service_healthy
      # - prometheus
      # - alertmanager
    ports:
      - "9021:9021"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9021/healthcheck || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
    env_file:
      - .env_file/infra.env

  # ------------------------------------------------------------------------------------------------------------
  # Monitoring
  # ------------------------------------------------------------------------------------------------------------

volumes:
  com_db:
  # minio_storage:
