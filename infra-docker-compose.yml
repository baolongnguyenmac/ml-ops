services:
  company_db:
    # db of a company
    image: postgres:16
    command: ['postgres', '-c', 'wal_level=logical']
    container_name: ctn_com_db
    healthcheck:
      test: [
        'CMD-SHELL',
        'psql -U ${COM_DB_USER} -d ${COM_DB_NAME} -c "SELECT 1" && psql -U ${COM_DB_USER} -d ${COM_META_BRONZE_DB_NAME} -c "SELECT 1" && psql -U ${COM_DB_USER} -d ${COM_META_SILVER_DB_NAME} -c "SELECT 1" && psql -U ${COM_DB_USER} -d ${COM_GOLD_DB_NAME} -c "SELECT 1"'
      ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${COM_DB_PORT}:5432"
    environment:
      - POSTGRES_DB=${COM_DB_NAME}
      - POSTGRES_USER=${COM_DB_USER}
      - POSTGRES_PASSWORD=${COM_DB_PASSWORD}
    volumes: 
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - com_db:/var/lib/postgresql

  # ------------------------------------------------------------------------------------------------------------
  # DataLake & LakeHouse
  # ------------------------------------------------------------------------------------------------------------

  dl-metastore:
    image: 'starburstdata/hive:3.1.3-e.15'
    container_name: ctn_dl_hive
    hostname: dl-metastore
    ports:
      - 9083:9083
    env_file:
      - .env_file/infra.env
    environment:
      - HIVE_METASTORE_JDBC_URL=${DL_METASTORE_JDBC_URL}
    depends_on:
      company_db:
        condition: service_healthy

  lh-metastore:
    image: 'starburstdata/hive:3.1.3-e.15'
    container_name: ctn_lh_hive
    hostname: lh-metastore
    ports:
      - 9084:9083
    env_file:
      - .env_file/infra.env
    environment:
      - HIVE_METASTORE_JDBC_URL=${LH_METASTORE_JDBC_URL}
    depends_on:
      company_db:
        condition: service_healthy

  trino:
    image: "trinodb/trino:480"
    container_name: ctn_trino
    hostname: trino
    ports:
      - "8082:8080" # So client can read from here
    # environment:
    #   - S3_ACCESS_KEY=${S3_ACCESS_KEY}
    #   - S3_SECRET_KEY=${S3_SECRET_KEY}
    env_file:
      - .env_file/infra.env
    volumes:
      - ./trino/etc:/usr/lib/trino/etc:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      - lh-metastore
      - dl-metastore

  # ------------------------------------------------------------------------------------------------------------
  # CDC
  # ------------------------------------------------------------------------------------------------------------

  # Manage brokers and configurations 
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ctn_zookeeper
    ports:
      - "2181:2181" # host_port:container_port
    healthcheck:
      test: echo srvr | nc zookeeper 2181 || exit 1
      start_period: 10s
      retries: 20
      interval: 10s
    env_file:
      - .env_file/infra.env

  # Kafka broker, each broker can be considered as a node
  broker:
    image: confluentinc/cp-server:7.5.0
    container_name: ctn_broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 10
    env_file:
      - .env_file/infra.env

  # Store Avro schemas for topics to ensure schema compatibility
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: ctn_schema_registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    healthcheck:
      start_period: 10s
      interval: 10s
      retries: 20
      test: curl --user superUser:superUser --fail --silent --insecure http://localhost:8081/subjects --output /dev/null || exit 1
    env_file:
      - .env_file/infra.env

  # CDC platform to capture changes in DB and stream them to Kafka
  debezium:
    image: debezium/connect:1.9
    container_name: ctn_debezium
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', '-X', 'GET', 'http://localhost:8083/connectors']
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8083:8083"
    env_file:
      - .env_file/infra.env

  # Debezium UI
  debezium-ui:
    image: debezium/debezium-ui:latest
    container_name: ctn_debezium_ui
    hostname: debezium-ui
    depends_on:
      debezium:
        condition: service_healthy
    ports:
      - '8088:8080'
    env_file:
      - .env_file/infra.env

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.5.0
    container_name: ctn_control_center
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      debezium:
        condition: service_healthy
    ports:
      - "9021:9021"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9021/healthcheck"] # Adjust the URL and options as needed
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env_file/infra.env

  # ------------------------------------------------------------------------------------------------------------
  # Monitoring
  # ------------------------------------------------------------------------------------------------------------

volumes:
  com_db:
  # minio_storage:
