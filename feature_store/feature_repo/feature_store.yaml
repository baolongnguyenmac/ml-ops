project: feature_store
provider: local
registry:
    registry_type: sql
    path: postgresql+psycopg://postgres:yourPassword@localhost:5432/feast_metadata
    cache_ttl_seconds: 60
    sqlalchemy_config_kwargs:
        echo: false
        pool_pre_ping: true

online_store:
    type: postgres
    host: localhost
    port: 5432
    database: feast_online
    db_schema: public
    user: postgres
    password: yourPassword

offline_store:
    type: postgres
    host: localhost
    port: 5432
    database: feast_offline
    db_schema: public
    user: postgres
    password: yourPassword
entity_key_serialization_version: 3
