seeds:
  - name: dim_location
    columns:
      - name: location_id
        tests:
          - unique
          - not_null
      - name: borough
        tests:
          - not_null
      - name: zone
        tests:
          - not_null
      - name: service_zone
        tests:
          - not_null

  - name: dim_payment_type
    columns:
      - name: payment_id
        tests:
          - unique
          - not_null
      - name: payment_type
        tests:
          - unique
          - not_null

  - name: dim_rate_code
    columns:
      - name: rate_code_id
        tests:
          - unique
          - not_null
      - name: rate_code
        tests:
          - unique
          - not_null

  - name: dim_vendor
    columns:
      - name: vendor_id
        tests:
          - unique
          - not_null
      - name: vendor_name
        tests:
          - unique
          - not_null