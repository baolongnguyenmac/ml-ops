connector.name=delta_lake

# The URIs of the Hive metastore to connect to
hive.metastore.uri=thrift://lh-metastore:9083

# Object storage credentials (MinIO)
# Port 9000 của Trino được expose sẵn bên trong network
# Cần expose ra ngoài host để push data via SDK
fs.native-s3.enabled=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
# bucket-name.s3.amazonaws.com -> s3.amazonaws.com/bucket-name
# s3.endpoint=http://minio:9000
# s3.path-style-access=true

# must specify. if not, service status will be unhealthy
s3.region=ap-northeast-1

# allow table registration: đăng ký 1 table schema với 1 file data có sẵn (yêu cầu file log đi kèm)
delta.register-table-procedure.enabled=true

# enable to write from trino to minio
delta.enable-non-concurrent-writes=true